name: Pokebots runtime build proof

on:
  push:
    branches: [pokebots-runtime-build-proof, pokebots-runtime-build-proof-windows]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.ref_name == 'pokebots-runtime-build-proof-windows' &&
          '[{"os":"windows-2025","platform":"win32","architecture":"x64","target":"win32-x64"}]' ||
          '[
            {"os":"macos-15","platform":"darwin","architecture":"arm64","target":"darwin-arm64"},
            {"os":"macos-15-intel","platform":"darwin","architecture":"x64","target":"darwin-x64"},
            {"os":"ubuntu-24.04","platform":"linux","architecture":"x64","target":"linux-x64"},
            {"os":"windows-2025","platform":"win32","architecture":"x64","target":"win32-x64"}
          ]') }}
    env:
      POKEBOTS_RUNTIME_BUILD_PROOF: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report checkout SHA and build target
        shell: bash
        run: |
          checkout_sha="$(git rev-parse HEAD)"
          printf 'Checkout SHA %s\nTarget %s\n' "$checkout_sha" "${{ matrix.target }}"
          test "$checkout_sha" = "$GITHUB_SHA"

      - name: Report repository checkout mode on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git symbolic-ref --quiet --short HEAD || echo "Detached HEAD"
          for key in core.autocrlf core.eol core.symlinks; do
            git config --show-origin --get "$key" || printf '%s is unset\n' "$key"
          done
          git ls-files --eol -- native-runtime.lock.json 'vendor/remote-desktop/patches/*.patch'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Set up Windows Node.js
        if: runner.os == 'Windows'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Export Windows tool paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "OPENBOT_BUN_DIR=$(Split-Path (Get-Command bun).Source -Parent)" >> $env:GITHUB_ENV
          "OPENBOT_CARGO_DIR=$(Split-Path (Get-Command cargo).Source -Parent)" >> $env:GITHUB_ENV
          "OPENBOT_NODE_DIR=$(Split-Path (Get-Command node).Source -Parent)" >> $env:GITHUB_ENV
          "OPENBOT_PERL_DIR=$(Split-Path (Get-Command perl).Source -Parent)" >> $env:GITHUB_ENV

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        # Sunshine does not build with OpenSSL 4. Runner images since 2026-10-28 link openssl@4 into the
        # Homebrew prefix, where CMake finds it before the keg-only openssl@3.
        run: |
          brew install ninja node pkgconf icu4c@78 miniupnpc openssl@3 opus
          if brew list openssl@4 >/dev/null 2>&1; then brew unlink openssl@4; fi
          brew link --force --overwrite openssl@3

      - name: Use CMake from the last successful macOS runtime build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          archive=cmake-4.4.5-macos-universal.tar.gz
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/Kitware/CMake/releases/download/v4.4.5/$archive"
          echo "679e77a96b9ef9484cc6c1445255fc4f84206b48a65420efbedf16bdab55fbff  $archive" | shasum -a 256 -c
          tar -xzf "$archive"
          cmake_bin="$RUNNER_TEMP/cmake-4.4.5-macos-universal/CMake.app/Contents/bin"
          "$cmake_bin/cmake" --version
          echo "$cmake_bin" >> "$GITHUB_PATH"

      - name: Set up Windows build dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: UCRT64
          cache: false
          update: true
          install: >-
            diffutils
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-graphviz
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain

      # The Linux build captures X11 and encodes in software; the packages match
      # LINUX_SUNSHINE_OPTIONS in scripts/build-remote-desktop-runtime.ts.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake gcc-14 g++-14 ninja-build pkg-config clang libclang-dev \
            libcap-dev libcurl4-openssl-dev libdrm-dev libevdev-dev libgbm-dev libminiupnpc-dev libnuma-dev \
            libopus-dev libpulse-dev libssl-dev libsystemd-dev systemd-dev libudev-dev libva-dev libwayland-dev \
            libx11-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb1-dev libxfixes-dev libxrandr-dev libxtst-dev \
            python3-jinja2 python3-setuptools

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build runtime on Linux
        if: runner.os == 'Linux'
        env:
          CC: gcc-14
          CXX: g++-14
          CMAKE_GENERATOR: Ninja
        run: |
          bun run build:remote-desktop-runtime
          dpkg-query -W > runner-packages.txt

      - name: Build runtime on macOS
        if: runner.os == 'macOS'
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          bun run build:remote-desktop-runtime
          brew list --versions > runner-packages.txt

      - name: Build runtime on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          set -euo pipefail
          native_perl="$(cygpath "$OPENBOT_PERL_DIR")/perl.exe"
          "$native_perl" -e 'die "Windows Perl is required\n" unless $^O eq "MSWin32";'
          export OPENSSL_SRC_PERL="$(cygpath -w "$native_perl")"
          export PATH="$PATH:$(cygpath "$OPENBOT_BUN_DIR"):$(cygpath "$OPENBOT_CARGO_DIR"):$(cygpath "$OPENBOT_NODE_DIR")"
          printf 'Build Git executable %s\n' "$(command -v git)"
          for key in core.autocrlf core.eol; do
            git config --system --get "$key" || printf 'System %s is unset\n' "$key"
            git config --global --get "$key" || printf 'Global %s is unset\n' "$key"
          done
          # Install the pin in the job's MSYS2 tree so explicit paths and -lssl/-lcrypto agree.
          openssl_dir="$(mktemp -d)"
          package=mingw-w64-ucrt-x86_64-openssl-3.6.5-1-any.pkg.tar.zst
          curl --fail --silent --show-error --location --output "$openssl_dir/$package" \
            "https://repo.msys2.org/mingw/ucrt64/$package"
          package_sha256=773e021ebad83f14b5c103db467411e8ff064663e1c7e7f730e2be72f4117064
          (
            cd "$openssl_dir"
            echo "$package_sha256  $package" | sha256sum -c
            tar -xf "$package"
          )
          package_name=mingw-w64-ucrt-x86_64-openssl
          expected_package="$package_name 3.6.5-1"
          pacman -U --noconfirm "$openssl_dir/$package"
          export OPENSSL_ROOT_DIR="$(cygpath -m /ucrt64)"
          openssl_version="$(/ucrt64/bin/openssl.exe version)"
          [[ "$openssl_version" == "OpenSSL 3.6.5 "* ]]
          export POKEBOTS_PROOF_WINDOWS_OPENSSL="$package sha256:$package_sha256"

          check_openssl_install() {
            local installed
            installed="$(pacman -Q "$package_name")"
            printf '%s\n' "$installed"
            [[ "$installed" == "$expected_package" ]] || return 1
            diff -qr "$openssl_dir/ucrt64/include/openssl" /ucrt64/include/openssl || return 1
            local file
            for file in lib/lib{ssl,crypto}{,.dll}.a bin/lib{ssl,crypto}-3-x64.dll bin/openssl.exe; do
              cmp "$openssl_dir/ucrt64/$file" "/ucrt64/$file" || return 1
              sha256sum "/ucrt64/$file" || return 1
            done
          }

          check_openssl_install
          bun run build:remote-desktop-runtime 2>&1 | tee "$openssl_dir/build.log"
          pacman -Q > runner-packages.txt

          proof=build/remote-desktop-runtime/win32/x64/build-proof
          {
            printf '%s\n' "$POKEBOTS_PROOF_WINDOWS_OPENSSL" "$openssl_version"
            check_openssl_install
            cmake_lib="$OPENSSL_ROOT_DIR/lib/libcrypto"
            grep -F -e "Found OpenSSL: $cmake_lib.a (found version \"3.6.5\"" \
              -e "Found OpenSSL: $cmake_lib.dll.a (found version \"3.6.5\"" "$openssl_dir/build.log"
            # GNU ld names the archive before each contributing member. Check every map.
            for library in ssl crypto; do
              grep -Eiq "lib$library\\.a\\(" "$proof/sunshine.map" || exit 1
            done
            linked_archives="$(grep -Ehoi '[^[:space:]()]*(libssl|libcrypto)(\.dll)?\.a\(' "$proof/"*.map |
              sort -u)"
            seen_ssl=false
            seen_crypto=false
            while IFS= read -r member; do
              archive_path="${member%?}"
              archive_path="${archive_path//\\//}"
              resolved="$(realpath -e "$(cygpath -u "$archive_path")")"
              case "$resolved" in
                /ucrt64/lib/libssl.a) seen_ssl=true ;;
                /ucrt64/lib/libcrypto.a) seen_crypto=true ;;
                *) printf 'Unexpected OpenSSL archive %s\n' "$resolved" >&2; exit 1 ;;
              esac
              printf '%s -> %s\n' "$archive_path" "$resolved"
            done <<< "$linked_archives"
            "$seen_ssl" && "$seen_crypto" || exit 1
          } | tee "$proof/windows-openssl.txt"

      - name: Verify runtime
        shell: bash
        run: |
          bun scripts/verify-remote-desktop-runtime.ts ${{ matrix.platform == 'win32' && '--windows' || matrix.platform == 'linux' && '--linux' || '' }}
          echo "Sunshine and Moonlight Web GPL-3.0 license checksum checks passed."
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            echo "Bundled library license checks passed."
          fi

      - name: Run macOS smoke test
        id: macos-smoke
        if: runner.os == 'macOS'
        run: bun run test:remote-desktop-runtime

      - name: Run Linux smoke test
        id: linux-smoke
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libxtst6
          xvfb-run -a bun run test:remote-desktop-runtime

      # The runner is Ubuntu 24.04. On Ubuntu 26.04 with only the runtime libraries of
      # scripts/hosting/packages.txt, each executable must find every library that it loads.
      - name: Check Linux runtime libraries on Ubuntu 26.04
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD/build/remote-desktop-runtime/linux/x64:/runtime:ro" \
            -v "$PWD/scripts/hosting/packages.txt:/packages.txt:ro" \
            ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944 \
            bash -euo pipefail -c '
              apt-get update -qq
              sed -n "/^# The remote desktop runtime\./,\$p" /packages.txt | grep -v "^#" |
                xargs apt-get install -y -qq --no-install-recommends >/dev/null
              missing=$(ldd /runtime/sunshine /runtime/web-server /runtime/streamer | grep "not found" || true)
              if [ -n "$missing" ]; then echo "$missing" >&2; exit 1; fi'

      - name: Create deterministic archive
        run: bun scripts/package-remote-desktop-runtime.ts ${{ matrix.platform }} ${{ matrix.architecture }}

      - name: Retain build evidence
        if: always() && hashFiles('build/remote-desktop-runtime/*/*/build-proof/report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-link-evidence-${{ matrix.target }}
          path: |
            build/remote-desktop-runtime/${{ matrix.platform }}/${{ matrix.architecture }}/build-proof/
            runner-packages.txt
            build/remote-desktop-runtime/DISTRIBUTION-SHA256SUMS.txt
          if-no-files-found: error

      - name: Report proof coverage
        if: always()
        shell: bash
        run: |
          proof="build/remote-desktop-runtime/${{ matrix.platform }}/${{ matrix.architecture }}/build-proof"
          if [[ -f "$proof/report.json" ]]; then
            {
              echo 'Link maps and dependency coverage'
              echo '```json'
              cat "$proof/report.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if command -v sha256sum >/dev/null; then
              sha256sum "$proof/"*.map
            else
              shasum -a 256 "$proof/"*.map
            fi
          else
            echo "Build proof unavailable. See the producer step for the failure." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report smoke result
        if: always()
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) echo "Runtime smoke result ${{ steps.macos-smoke.outcome }}" ;;
            Linux) echo "Runtime smoke result ${{ steps.linux-smoke.outcome }}" ;;
            Windows) echo "Runtime smoke skipped. The native build workflow has no Windows smoke step." ;;
          esac

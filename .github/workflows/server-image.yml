name: Server image

# Builds the Custom self-hosted server image (docker/Dockerfile) from the x64 AppImage of one commit,
# for the personal VPS servers. Runs automatically on pushes to main and publishes to GHCR after the
# container smoke test passes, while still uploading the tarball artifact for manual loads. Official
# releases still use release.yml.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build x64 server image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Install provider control artifacts
        run: |
          bun scripts/install-codex-runtime.ts linux x64
          bun scripts/install-claude-runtime.ts linux x64
          bun scripts/install-grok-runtime.ts linux x64

      - name: Build AppImage
        run: bun run dist:linux

      - name: Build the image
        run: |
          set -euo pipefail
          shopt -s nullglob
          appImages=(dist/*.AppImage)
          if [ "${#appImages[@]}" -ne 1 ]; then
            echo "Expected one AppImage." >&2
            exit 1
          fi
          mkdir image
          mv "${appImages[0]}" image/OpenBot.AppImage
          version=$(jq -r .version package.json)
          short=${GITHUB_SHA::9}
          docker build --file docker/Dockerfile --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg "VERSION=$version-custom" --build-arg "REVISION=$short" \
            --tag "openbot-custom:$short" image
          docker save "openbot-custom:$short" | gzip -1 > "openbot-custom-$short.tar.gz"
          echo "IMAGE_FILE=openbot-custom-$short.tar.gz" >> "$GITHUB_ENV"

      # The image starts with the sandbox on and its control socket answers.
      - name: Start and stop the image
        run: |
          set -euo pipefail
          short=${GITHUB_SHA::9}
          trap 'docker logs openbot' ERR
          docker run --detach --name openbot --shm-size 1g \
            --security-opt seccomp=docker/seccomp.json --security-opt no-new-privileges:true "openbot-custom:$short"
          for _ in $(seq 1 120); do
            if docker exec openbot test -S /run/openbot/control.sock && docker exec openbot openbot status; then
              docker stop --time 60 openbot
              exit 0
            fi
            sleep 1
          done
          echo "The control socket did not answer." >&2
          exit 1

      - name: Push image to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short=${GITHUB_SHA::9}
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "openbot-custom:$short" "$image:sha-$short"
          docker push "$image:sha-$short"
          if [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
            docker tag "openbot-custom:$short" "$image:main"
            docker tag "openbot-custom:$short" "$image:latest"
            docker push "$image:main"
            docker push "$image:latest"
          fi

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-image
          path: ${{ env.IMAGE_FILE }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
